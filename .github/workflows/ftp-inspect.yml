name: FTP inspect (debug)

on:
  workflow_dispatch:
    inputs:
      host:
        description: FTP host (để trống = secret FTP_SERVER)
        required: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y lftp >/dev/null
      - name: List FTP directories
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${{ inputs.host || secrets.FTP_SERVER }}" -e "
            set ftp:ssl-force true; set ssl:verify-certificate no;
            echo '== PWD'; pwd;
            echo '== ROOT'; cls -la;
            echo '== state'; cls -la .ftp-deploy-sync-state.json DO_NOT_UPLOAD_HERE public_html/index.html;
            echo '== public_html'; cls -la public_html;
            echo '== domains'; cls -la domains;
            echo '== domains/modigi.online'; cls -la domains/modigi.online;
            echo '== domains/modigi.online/public_html'; cls -la domains/modigi.online/public_html;
            bye" || true
