<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <filter id="grain" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .40  0 0 0 0 .28  0 0 0 .55 0"/>
  </filter>
  <filter id="pores" x="0" y="0">
    <feTurbulence type="turbulence" baseFrequency=".035 .05" numOctaves="4" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .16  0 0 0 0 .10  0 0 0 0 .06  0 0 0 .9 -.05"/>
  </filter>
  <rect width="600" height="600" fill="#211a15"/>
  <rect width="600" height="600" filter="url(#pores)" opacity=".7"/>
  <rect width="600" height="600" filter="url(#grain)" opacity=".18"/>
</svg>
